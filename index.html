<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Match Game</title>
 
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-light">

    <div class="container py-5 text-center">

        <h1 class="fw-bold text-primary mb-3">
            Memory Match
        </h1>

        <p class="text-secondary mb-4">
            Şəkillərin uyğun cütlərini tap!
        </p>
        
        <div class="row justify-content-center mb-4">
            <div class="col-auto">
                <h5>Moves: <span id="moves">0</span></h5>
            </div>
            <div class="col-auto">
                <h5>Matched Pairs: <span id="matched">0</span>/8</h5>
            </div>
        </div>
        
        <button id="restart-btn" class="btn btn-primary mb-4">
            Restart Game
        </button>
        
        <!-- JavaScript 16 kartı avtomatik bu div-in daxilində yaradacaq -->
        <div id="game-board"></div>

    </div>

    <script src="script.js"></script>
</body>
</html>
